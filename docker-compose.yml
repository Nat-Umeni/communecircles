services:
  app:
    build: .
    container_name: communecircles
    volumes:
      - ./:/var/www
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # Runs queued jobs, such as the confirmation and password reset emails.
  # NOTE: the image's entrypoint always starts PHP-FPM, so this overrides it. queue:listen reloads the
  # code for every job, so changes apply without restarting the worker (production would use queue:work).
  queue:
    build: .
    entrypoint: ["php", "artisan", "queue:listen", "--tries=3", "--timeout=60"]
    volumes:
      - ./:/var/www
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8001:80"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: unless-stopped

  # Runs the Vite dev server.
  # NOTE: built from the app's image, so node_modules are installed for the same system (glibc) whichever container
  # runs npm; an Alpine image here would need different native binaries (rollup, esbuild, Tailwind) in the same
  # shared folder. The image's entrypoint always starts PHP-FPM, so this overrides it.
  node:
    build: .
    entrypoint: ["sh", "-c", "npm install && exec npx vite"]
    volumes:
      - ./:/var/www
    ports:
      - "5173:5173"
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: communecircles
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  mysql_data: